<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lachbox OS</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>

<div class="login-view no-print" id="loginView" hidden>
  <div class="login-card">
    <img id="loginLogo" class="login-logo" alt="Lachbox">
    <h1>Lachbox OS</h1>
    <p class="login-sub">Log in met je @lachbox.nl e-mailadres en wachtwoord.</p>

    <form id="loginPasswordForm" class="login-form">
      <input type="email" id="loginEmail" placeholder="naam@lachbox.nl" autocomplete="email" required>
      <input type="password" id="loginPassword" placeholder="Wachtwoord" autocomplete="current-password" required>
      <button type="submit" class="btn primary" id="loginSubmitBtn">Inloggen</button>
    </form>

    <div class="login-message" id="loginMessage"></div>
  </div>
</div>

<div class="app-shell" id="appShell" hidden>
  <aside class="sidebar no-print" id="sidebar">
    <div class="sidebar-brand">
      <img id="sidebarLogo" alt="Lachbox">
      <span class="brand-name">Lachbox OS</span>
      <button class="sidebar-close-btn" id="btnCloseSidebar" aria-label="Menu sluiten">✕</button>
    </div>
    <div id="sidebarSearchWrap"></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-account" id="sidebarAccount"></div>
  </aside>

  <div class="app-main">
    <div class="topbar no-print">
      <button class="sidebar-toggle" id="btnToggleSidebar" aria-label="Menu">☰</button>
      <span class="brand-name">Lachbox OS</span>
    </div>
    <main class="app-content" id="appContent"></main>
  </div>
</div>

<div class="toast-container no-print" id="toastContainer"></div>

<div class="modal-overlay no-print" id="confirmModal" hidden>
  <div class="modal">
    <h2 id="confirmTitle">Weet je het zeker?</h2>
    <p id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="btn secondary" id="btnConfirmCancel">Annuleren</button>
      <button class="btn danger" id="btnConfirmOk">Doorgaan</button>
    </div>
  </div>
</div>

<!-- Classic scripts (geen type="module"): werkt gegarandeerd ook als dit
     bestand rechtstreeks vanaf schijf wordt geopend (file://), niet alleen
     wanneer het gehost wordt. Volgorde is belangrijk: elk bestand hangt zijn
     functies aan het gedeelde LachboxOS-namespace-object. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js?v=6"></script>
<script src="js/supabase-client.js?v=6"></script>
<script src="js/logo-data.js?v=6"></script>
<script src="js/icons.js?v=6"></script>
<script src="js/utils.js?v=6"></script>
<script src="js/storage.js?v=6"></script>
<script src="js/auth.js?v=6"></script>
<script src="js/state.js?v=6"></script>
<script src="js/navigation.js?v=6"></script>
<script src="js/dashboard.js?v=6"></script>
<script src="js/crm.js?v=6"></script>
<script src="js/checklists.js?v=6"></script>
<script src="js/events.js?v=6"></script>
<script src="js/pdf.js?v=6"></script>
<script src="js/invoices.js?v=6"></script>
<script src="js/email.js?v=6"></script>
<script src="js/chat.js?v=6"></script>
<script src="js/reviews.js?v=6"></script>
<script src="js/finance.js?v=6"></script>
<script src="js/search.js?v=6"></script>
<script src="js/settings.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
